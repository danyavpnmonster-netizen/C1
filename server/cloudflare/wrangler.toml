# Выделенный «Сервер #1» для Sunrise Bay на Cloudflare Workers (бесплатный тариф).
# Развернуть: npx wrangler deploy  (нужен аккаунт Cloudflare и токен API)
name = "sunrise-bay-server"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
